title: AWS IAM Access Key Created for a Different User
id: 43b4e28d-8295-4d85-922d-1def0a78ac82
related:
  - id: b420c517-9ca9-4f04-86e1-5136a63d75b4
    type: similar
status: experimental
description: |
  Detects an IAM user calling iam:CreateAccessKey for a *different* IAM user.
  Minting long-lived access keys on another identity is a common persistence and
  privilege-escalation technique: an attacker with iam:CreateAccessKey can obtain
  durable credentials for a more privileged user, and those credentials survive
  password resets and session revocation of the original foothold.

  Logic: successful CreateAccessKey events where requestParameters.userName is
  present and differs from the calling IAM user (userIdentity.userName).
  Self-service key creation (no target userName, or target == caller) and failed
  calls (errorCode present) are excluded.

  Scope note: restricted to userIdentity.type=IAMUser because assumed-role and
  federated callers carry no userIdentity.userName to compare against. Those
  callers are covered by the companion rule "AWS IAM Access Key Created by an
  Assumed-Role or Federated Caller".
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
  - https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/
author: Robert Garritano
date: 2026-11-01
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
    userIdentity.type: IAMUser
    requestParameters.userName|exists: true
  filter_main_self_service:
    requestParameters.userName|fieldref: userIdentity.userName
  filter_main_failed_call:
    errorCode|exists: true
  # Written as explicit AND NOT (rather than `not 1 of filter_*`) because the
  # Splunk backend cannot OR a |fieldref comparison with other expressions.
  condition: selection and not filter_main_self_service and not filter_main_failed_call
fields:
  - eventTime
  - userIdentity.arn
  - userIdentity.userName
  - requestParameters.userName
  - responseElements.accessKey.accessKeyId
  - sourceIPAddress
  - userAgent
  - recipientAccountId
falsepositives:
  - IAM administrators provisioning keys for service or break-glass accounts (prefer roles; allowlist known admin principals after review)
  - Identity automation (e.g. onboarding pipelines) running as an IAM user rather than a role
  - Key rotation tooling that creates the replacement key on behalf of the key owner
level: medium
