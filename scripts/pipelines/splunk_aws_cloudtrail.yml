# pySigma processing pipeline: scope AWS CloudTrail rules to the Splunk Add-on
# for AWS sourcetype. Field names are left as-is because the add-on extracts
# CloudTrail JSON keys verbatim (e.g. userIdentity.userName).
name: Splunk AWS CloudTrail (Splunk Add-on for AWS)
priority: 20
transformations:
  - id: cloudtrail_sourcetype
    type: add_condition
    conditions:
      sourcetype: aws:cloudtrail
    rule_conditions:
      - type: logsource
        product: aws
        service: cloudtrail
